[project]
name = "zeroguess-backend"
version = "0.1.0"
description = "Zero-Guessing & Contradiction-Checking Document AI - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "google-genai>=1.0",
    "pymupdf>=1.25",
    "python-multipart>=0.0.12",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    "numpy>=2.0",
    "pyjwt>=2.15.1",
    "google-auth>=2.63.1",
    "requests>=2.34.2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.4.0",
    "cryptography>=43",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.18"]
s3 = [
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
