<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a8b6bd" />
    <meta name="description" content="A document assistant that answers only with proof: every claim cited to a verbatim quote, conflicts shown side by side, and no guessing." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZeroGuess: answers with proof</title>
    <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("zg-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preload" as="image" href="/hero-glass-poster.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:40rem;margin:4rem auto;padding:0 1rem;font-family:sans-serif;line-height:1.5">
        <h1>Every answer arrives with its proof.</h1>
        <p>ZeroGuess answers questions across your PDFs and cites every claim to a verbatim quote. It needs JavaScript to run.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
