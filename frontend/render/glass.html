<!doctype html>
<!-- Offline render scene (not shipped): glass document pages in mist, one carrying a lime proof line.
     Deterministic: window.renderAt(t) draws time t (seconds); the loop period is T, so frame 0 == frame T. -->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#a8b6bd;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'

const q = new URLSearchParams(location.search)
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080)
const T = +(q.get('T') || 12)
const TAU = Math.PI * 2

// palette (matches src/styles/tokens.css)
const HAZE_TOP = new THREE.Color('#c4cfd4'), HAZE_BOT = new THREE.Color('#8fa1aa')
const INK = new THREE.Color('#13343f'), LIME = new THREE.Color('#c3ff8f')

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
// vertical mist gradient as the background
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256
  const g = c.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 256)
  grad.addColorStop(0, '#' + HAZE_TOP.getHexString()); grad.addColorStop(1, '#' + HAZE_BOT.getHexString())
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256)
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace
  scene.background = tex
}
scene.fog = new THREE.Fog(new THREE.Color('#a9b7be'), 9, 24)
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture
scene.environmentIntensity = 0.9

const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100)

function radial(color, inner = 0, a = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 256
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, inner, 128, 128, 128)
  const col = new THREE.Color(color)
  const rgb = `${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)}`
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(0.55, `rgba(${rgb},${a * 0.35})`); gr.addColorStop(1, `rgba(${rgb},0)`)
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
}
const blobs = []
for (const [color, x, y, z, s, a] of [['#f2f7f8', 2.5, 1.6, -7, 11, 0.95], ['#5f8794', 3.5, -4.2, -8, 12, 0.6], ['#d9ffbf', 0.6, -0.6, -5, 6.5, 0.55], ['#ffffff', -1.5, 3.2, -9, 10, 0.6]]) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: radial(color, 0, a), transparent: true, depthWrite: false, fog: false }))
  sp.position.set(x, y, z); sp.scale.set(s, s, 1); sp.userData = { x, y }; scene.add(sp); blobs.push(sp)
}

const key = new THREE.DirectionalLight('#ffffff', 3.2); key.position.set(5, 9, 5); scene.add(key)
const rim = new THREE.DirectionalLight('#cfe6ff', 1.2); rim.position.set(-6, 2, -4); scene.add(rim)
scene.add(new THREE.AmbientLight('#dfe7ea', 0.6))

// seeded random, so every render is identical
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)

const glass = new THREE.MeshPhysicalMaterial({
  color: '#e8f0f2', transmission: 1, thickness: 0.9, roughness: 0.1, ior: 1.5, metalness: 0,
  clearcoat: 1, clearcoatRoughness: 0.08, attenuationColor: new THREE.Color('#9db8c2'), attenuationDistance: 2.2,
  iridescence: 0.35, iridescenceIOR: 1.3, specularIntensity: 1, envMapIntensity: 1.1,
})
const lineMat = new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.2, depthWrite: false })
const headMat = new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.42, depthWrite: false })
const limeMat = new THREE.MeshBasicMaterial({ color: LIME, transparent: true, opacity: 0.95, depthWrite: false, toneMapped: false })
const limeGlow = new THREE.SpriteMaterial({ map: radial('#c3ff8f', 0, 1), transparent: true, opacity: 0.5, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending, fog: false })

const PAGE_W = 2.1, PAGE_H = 2.97, PAGE_D = 0.1
const pageGeo = new RoundedBoxGeometry(PAGE_W, PAGE_H, PAGE_D, 6, 0.07)
const pages = []
const N = 6
let marker = null, markerGlow = null, markerLine = null

for (let i = 0; i < N; i++) {
  const g = new THREE.Group()
  const slab = new THREE.Mesh(pageGeo, glass)
  g.add(slab)
  // printed lines on the page
  const lines = new THREE.Group()
  const top = PAGE_H / 2 - 0.32
  const head = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.07), headMat)
  head.position.set(-PAGE_W / 2 + 0.25 + 0.55, top, PAGE_D / 2 + 0.002); lines.add(head)
  const count = 14
  for (let k = 0; k < count; k++) {
    const w = k % 5 === 4 ? 0.6 + rnd() * 0.5 : 1.35 + rnd() * 0.3
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.026), lineMat)
    const y = top - 0.28 - k * 0.15
    m.position.set(-PAGE_W / 2 + 0.25 + w / 2, y, PAGE_D / 2 + 0.002)
    lines.add(m)
    if (i === 2 && k === 6) {
      // the proven sentence: a lime marker behind the line, swept by time
      marker = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.085), limeMat)
      marker.position.set(-PAGE_W / 2 + 0.2, y, PAGE_D / 2 + 0.001)
      marker.geometry.translate(0.5, 0, 0)
      markerGlow = new THREE.Sprite(limeGlow)
      markerGlow.position.set(0.05, y, PAGE_D / 2 + 0.05)
      markerGlow.scale.set(2.6, 1.1, 1)
      markerLine = { w: w + 0.1 }
      lines.add(marker); lines.add(markerGlow)
    }
  }
  g.add(lines)
  // a deck fanned in depth, the centre page nearest the camera
  const d = i - (N - 1) / 2
  const ang = d * 0.42, R = 5.4
  g.userData = { d, phase: rnd() * TAU, base: new THREE.Vector3(2.3 + Math.sin(ang) * R, -0.35 + d * 0.16, Math.cos(ang) * R - R - 0.6), rotY: ang * 0.9 - 0.18, rotZ: d * 0.04 - 0.04 }
  g.scale.setScalar(0.95)
  scene.add(g)
  pages.push(g)
}

// dust motes drifting on a closed loop
const DUST = 260
const dustGeo = new THREE.BufferGeometry()
const dustBase = new Float32Array(DUST * 3), dustPos = new Float32Array(DUST * 3), dustPhase = new Float32Array(DUST)
for (let i = 0; i < DUST; i++) {
  dustBase.set([(rnd() - 0.5) * 22, (rnd() - 0.5) * 12, -2 - rnd() * 14], i * 3)
  dustPhase[i] = rnd() * TAU
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3))
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: '#f4f8f9', size: 0.045, transparent: true, opacity: 0.7, depthWrite: false }))
scene.add(dust)

window.renderAt = (t) => {
  const p = (t % T) / T            // 0..1 loop phase
  const s = Math.sin(TAU * p), c = Math.cos(TAU * p)
  for (const g of pages) {
    const u = g.userData
    g.position.set(u.base.x + Math.sin(TAU * p + u.phase) * 0.05, u.base.y + Math.sin(TAU * p * 2 + u.phase) * 0.09, u.base.z)
    g.rotation.set(-0.16 + Math.sin(TAU * p + u.phase) * 0.05, u.rotY + s * 0.14, u.rotZ + c * 0.02)
  }
  // the proof marker sweeps in, holds, then fades so the loop restarts clean
  const sweep = THREE.MathUtils.smoothstep(p, 0.12, 0.34) * (1 - THREE.MathUtils.smoothstep(p, 0.84, 0.97))
  if (marker) {
    marker.scale.x = Math.max(0.0001, sweep * markerLine.w)
    limeGlow.opacity = 0.55 * sweep * (0.85 + 0.15 * Math.sin(TAU * p * 3))
  }
  for (let i = 0; i < DUST; i++) {
    const ph = dustPhase[i]
    dustPos[i * 3] = dustBase[i * 3] + Math.sin(TAU * p + ph) * 0.4
    dustPos[i * 3 + 1] = dustBase[i * 3 + 1] + Math.cos(TAU * p + ph) * 0.3
    dustPos[i * 3 + 2] = dustBase[i * 3 + 2]
  }
  dustGeo.attributes.position.needsUpdate = true
  for (const b of blobs) b.position.set(b.userData.x + Math.sin(TAU * p) * 0.5, b.userData.y + Math.cos(TAU * p) * 0.3, b.position.z)
  camera.position.set(Math.sin(TAU * p) * 0.7, -0.55 + Math.cos(TAU * p) * 0.15, 8.6)
  camera.lookAt(0, 0.05, -1.2)
  renderer.render(scene, camera)
}
window.renderAt(0)
window.__ready = true
</script>
</body>
</html>
