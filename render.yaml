# Render Blueprint: web service (API + web app) and a Postgres database (pgvector is enabled by the app on start).
services:
  - type: web
    name: zeroguess
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: zeroguess-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: s3
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: ADMIN_EMAILS, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }
databases:
  - name: zeroguess-db
    plan: basic-256mb
    postgresMajorVersion: "17"
